<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indoor reconstruction viewer scaffold</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111827; color: #e5e7eb; font: 14px system-ui, sans-serif; }
    main { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 12px 16px; border-bottom: 1px solid #374151; }
    canvas { width: 100%; height: 100%; display: block; }
    #status { color: #9ca3af; margin-left: 12px; }
  </style>
</head>
<body>
<main>
  <header>Semantic Scene V2 plan scaffold <span id="status">waiting for ?scene=...</span></header>
  <canvas id="view"></canvas>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
