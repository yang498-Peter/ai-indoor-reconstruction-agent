name: portable-reconstruction-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_portable_repo.py
      - run: python tests/codex-scan/bh-20260812-reconstruction-orchestrator.test.py
      - run: python tests/contracts/test_stage_contract.py
      - run: python tests/contracts/test_v2_publish_contract.py
      - run: python tests/contracts/test_capture_readiness.py
      - run: python tests/scene-v2/test_scene_api.py
      - run: python tests/scene-v2/test_geometry_pipeline.py
      - run: python tests/scene-v2/test_geometry_workflow.py
      - run: node --test tests/scene-v2/scene-core.test.mjs
      - run: python scene-core/make_sample_scene.py --output sample-out
