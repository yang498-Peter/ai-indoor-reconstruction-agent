name: portable-reconstruction-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-python:
    name: python-${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --all-groups --python python
      - name: Validate portable checkout and skill migration
        run: |
          uv run python scripts/validate_portable_repo.py
          uv run python scripts/sync_skills.py --check
      - name: Run Python contracts, MCP smoke, and synthetic E2E
        run: uv run python -m pytest -q
      - name: Run customer workspace synthetic contracts
        working-directory: services/customer-workspace
        run: uv run --project ../.. python -m unittest discover -s tests -v
      - name: Run presentation exchange smoke
        run: uv run python scripts/smoke_presentation.py --work "${{ runner.temp }}/presentation-smoke"
      - name: Build standalone distributions
        run: uv build --out-dir "${{ runner.temp }}/standalone-dist"
      - name: Install and run outside checkout with source access denied
        run: uv run python scripts/verify_standalone_install.py --wheel "${{ runner.temp }}/standalone-dist/indoor_reconstruction_agent-0.9.0-py3-none-any.whl" --work "${{ runner.temp }}/standalone-installed"
      - name: Preserve independent installation receipt
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/standalone-installed/standalone-install.json
          if-no-files-found: error
      - name: Run quick benchmark
        run: uv run indoor-recon benchmark --output outputs/ci-benchmark-report.json
      - name: Preserve benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python-version }}
          path: outputs/ci-benchmark-report.json
          if-no-files-found: error

  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/scene-v2/*.test.mjs services/customer-workspace/frontend/tests/preflight.test.cjs

  lint-type-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --all-groups --python python
      - run: uv run ruff check src tests/contracts/test_wp8_engineering.py
      - run: uv run ruff check hatch_build.py scripts/verify_standalone_install.py tests/test_standalone_resources.py
      - run: uv run mypy
      - run: uv build
      - run: uv run indoor-recon --help

  deterministic-checks:
    if: always()
    needs: [deterministic-python, node-contract, lint-type-package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all deterministic checks
        env:
          PYTHON_RESULT: ${{ needs.deterministic-python.result }}
          NODE_RESULT: ${{ needs.node-contract.result }}
          PACKAGE_RESULT: ${{ needs.lint-type-package.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$NODE_RESULT" = success
          test "$PACKAGE_RESULT" = success
