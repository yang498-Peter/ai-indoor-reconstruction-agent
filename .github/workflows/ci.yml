name: portable-reconstruction-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_portable_repo.py
      - run: python tests/codex-scan/bh-20260812-reconstruction-orchestrator.test.py
      - run: python tests/contracts/test_stage_contract.py
      - run: python tests/contracts/test_v2_publish_contract.py
      - run: python tests/contracts/test_capture_readiness.py
      - run: python tests/contracts/test_evidence_independence.py
      - run: python tests/contracts/test_execution_identity.py
      - run: python tests/contracts/test_pipeline_execution_identity.py
      - run: python tests/contracts/test_intake_revalidation.py
      - run: python tests/contracts/test_check_recompute.py
      - run: python tests/scene-v2/test_degraded_geometry_services.py
      - run: python tests/scene-v2/test_opening_candidates.py
      - run: python tests/scene-v2/test_wall_graph_adjust.py
      - run: python tests/scene-v2/test_candidate_topology.py
      - run: python tests/scene-v2/test_fit_service.py
      - run: python tests/scene-v2/test_level_survey.py
      - run: python tests/scene-v2/test_photo_projection.py
      - run: python tests/scene-v2/test_semantic_candidates.py
      - run: python tests/scene-v2/test_wall_dossier.py
      - run: python tests/scene-v2/test_scene_api.py
      - run: python tests/scene-v2/test_geometry_pipeline.py
      - run: python tests/scene-v2/test_geometry_workflow.py
      - run: python tests/scene-v2/test_wall_metrics_v2.py
      - run: python tests/scene-v2/test_mcp_server.py
      - run: python tests/scene-v2/test_static_renderers_v2.py
      - run: python tests/scene-v2/test_structural_omission_audit.py
      - run: python tests/scene-v2/test_scene_evidence_overlay.py
      - run: python tests/scene-v2/test_cleanroom_macro_builder.py
      - run: python tests/scene-v2/test_indexed_pointcloud_evidence.py
      - run: python tests/scene-v2/test_viewer_presentation_stats.py
      - run: node --test tests/scene-v2/scene-core.test.mjs
      - run: python scene-core/make_sample_scene.py --output sample-out
