name: presentation-skill-tools

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.codex/skills/**'
      - 'scripts/indoor_presentation_evidence.py'
      - 'scripts/presentation_alignment.py'
      - 'scripts/validate_presentation_ifc.py'
      - 'scripts/smoke_presentation.py'
      - 'scripts/sync_skills.py'
      - 'requirements*.txt'
      - 'constraints-presentation-py312.txt'
      - 'docs/PORTABILITY.zh-CN.md'
      - 'docs/*SOP*'
      - 'tests/test_presentation_*.py'
      - '.github/workflows/presentation-skills.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.codex/skills/**'
      - 'scripts/indoor_presentation_evidence.py'
      - 'scripts/presentation_alignment.py'
      - 'scripts/validate_presentation_ifc.py'
      - 'scripts/smoke_presentation.py'
      - 'scripts/sync_skills.py'
      - 'requirements*.txt'
      - 'constraints-presentation-py312.txt'
      - 'docs/PORTABILITY.zh-CN.md'
      - 'docs/*SOP*'
      - 'tests/test_presentation_*.py'
      - '.github/workflows/presentation-skills.yml'

permissions:
  contents: read

jobs:
  synthetic-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-presentation.txt pytest
      - run: python -m pip check
      - run: python scripts/validate_portable_repo.py
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q tests/test_presentation_evidence_fast.py tests/test_presentation_alignment.py tests/test_presentation_ifc.py tests/test_presentation_delivery_inventory.py tests/test_presentation_brand_asset.py
      - run: python scripts/smoke_presentation.py --work "${{ runner.temp }}/presentation-smoke"
