[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "indoor-reconstruction-agent"
version = "0.9.0"
description = "Evidence-bounded indoor reconstruction orchestration, CLI, and MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "jsonschema>=4.23,<5",
  "laspy>=2.5,<3",
  "matplotlib>=3.8,<4",
  "mcp==2.0.0",
  "numpy>=1.26,<2.4",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
  "scipy>=1.12,<2",
  "shapely>=2.0,<3",
]

[project.scripts]
indoor-recon = "indoor_reconstruction.cli:main"

[project.optional-dependencies]
presentation = ["ifcopenshell==0.8.5", "trimesh==4.12.2", "lazrs==0.8.2"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "ifcopenshell==0.8.5",
  "lazrs==0.8.2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "trimesh==4.12.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/indoor_reconstruction"]

[tool.hatch.build.targets.sdist]
# The hook adds the exact public runtime allowlist; private folders stay excluded.
only-include = ["src", "pyproject.toml", "uv.lock", "README.md", "hatch_build.py", "runtime-files.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.uv-cache",
  "/.venv",
  "/dist",
  "/outputs",
  "/wp8-benchmark*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/indoor_reconstruction"]
ignore_missing_imports = true
